<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WebSocket Client</title>

    <link rel="stylesheet" href="index.css">

</head>

<body>
    <div class="center">
        <div class="card">
            <p id="keyText">Your key: 9382</p>
        </div>
    </div>

    <div id="area">
        <div id="clock"></div>
    </div>

    <div class="column" style="position: absolute; bottom: 10px; left: 10px;">
        <input type="text" id="keyInput" placeholder="Key" style="width: 125px;" />
        <div class="row">
            <input type="text" id="messageInput" placeholder="Enter message" style="width: 250px;" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flipclock@^1/dist/FlipClock.umd.js"></script>
    <script src="index.js"></script>
</body>

</html>
